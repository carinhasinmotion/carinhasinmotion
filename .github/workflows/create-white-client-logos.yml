name: Generate white client logos
on:
  push:
    branches:
      - white-client-png-assets-20261101
permissions:
  contents: write
jobs:
  png:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests cairosvg pillow
      - run: python scripts/generate_white_client_logos.py
      - name: Commit PNG files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Index/clients/*.png
          git diff --cached --quiet || (git commit -m "Add eight local white transparent PNG client logos" && git push)
